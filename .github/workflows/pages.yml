name: Deploy AgenticWeb

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Generate AgentiCuantico brain GLB
        run: |
          python3 -m pip install --disable-pip-version-check --quiet numpy trimesh
          python3 scripts/generate_brain_glb.py public/assets/AgentiCuantico_brain_PBR.glb
          test -s public/assets/AgentiCuantico_brain_PBR.glb

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
