name: Autonomous Brain Supervisor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/autonomous-brain-supervisor.yml"
      - "worker.js"
      - "wrangler.jsonc"
      - "public/**"
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  supervisor:
    runs-on: ubuntu-slim
    timeout-minutes: 6
    steps:
      - name: Check public brain health
        run: |
          set -euo pipefail
          url="https://agenticweb.agenticuantico.workers.dev/health"
          ok=0
          for attempt in 1 2 3 4 5; do
            echo "Health check attempt $attempt/5"
            response="$(curl -sS --max-time 20 -w $'\nHTTP_STATUS:%{http_code}' "$url" || true)"
            echo "$response"
            body="${response%$'\nHTTP_STATUS:'*}"
            status="${response##*HTTP_STATUS:}"
            if [ "$status" = "200" ] && echo "$body" | grep -q '"ok":true'; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = "1"

      - name: Exercise public conversation path
        run: |
          set -euo pipefail
          payload='{"message":"Diagnóstico interno: respondé únicamente OK.","history":[]}'
          ok=0
          for attempt in 1 2 3; do
            echo "Conversation check attempt $attempt/3"
            response="$(curl -sS --max-time 45 -H 'Content-Type: application/json' -H 'Origin: https://agenticuantico.dev.ar' -d "$payload" -w $'\nHTTP_STATUS:%{http_code}' https://agenticweb.agenticuantico.workers.dev/v1/public/chat || true)"
            echo "$response"
            body="${response%$'\nHTTP_STATUS:'*}"
            status="${response##*HTTP_STATUS:}"
            if [ "$status" = "200" ] && echo "$body" | grep -q '"ok":true'; then
              ok=1
              break
            fi
            sleep 8
          done
          test "$ok" = "1"
