name: Deploy AgenticWeb to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "worker.js"
      - "_worker.js"
      - "wrangler.jsonc"
      - "index.html"
      - "app.js"
      - "styles.css"
      - ".github/workflows/cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Worker + Assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy worker.js
