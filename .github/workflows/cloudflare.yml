name: Deploy AgenticWeb to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "worker.js"
      - "_worker.js"
      - "wrangler.jsonc"
      - "index.html"
      - "app.js"
      - "styles.css"
      - "public/**"
      - ".github/workflows/cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing GitHub secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing GitHub secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          if [ -z "$HF_TOKEN" ]; then echo "HF_TOKEN no configurado: se usará el fallback de Cloudflare Workers AI"; fi

      - name: Install Wrangler
        run: npm install --no-save wrangler@4.136.3

      - name: Configure Hugging Face secret in Worker (optional)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "$HF_TOKEN" ]; then
            printf '%s' "$HF_TOKEN" | npx wrangler secret put HF_TOKEN --name agenticweb
          else
            echo "HF_TOKEN no configurado; se mantendrá el fallback de Cloudflare Workers AI."
          fi
      - name: Configure Designer Agent secrets (optional)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          AGENTIC_ADMIN_KEY: ${{ secrets.AGENTIC_ADMIN_KEY }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            printf '%s' "$GH_TOKEN" | npx wrangler secret put GH_TOKEN --name agenticweb
          else
            echo "GH_TOKEN no configurado: Designer Agent no podrá publicar en GitHub."
          fi
          if [ -n "$AGENTIC_ADMIN_KEY" ]; then
            printf '%s' "$AGENTIC_ADMIN_KEY" | npx wrangler secret put AGENTIC_ADMIN_KEY --name agenticweb
          else
            echo "AGENTIC_ADMIN_KEY no configurado: Designer Agent quedará protegido."
          fi

      - name: Configure Auth + Billing secrets (optional)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH_SESSION_SECRET: ${{ secrets.AUTH_SESSION_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          MERCADOPAGO_ACCESS_TOKEN: ${{ secrets.MERCADOPAGO_ACCESS_TOKEN }}
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
        run: |
          if [ -n "$AUTH_SESSION_SECRET" ]; then printf '%s' "$AUTH_SESSION_SECRET" | npx wrangler secret put AUTH_SESSION_SECRET --name agenticweb; else echo "AUTH_SESSION_SECRET no configurado: se usará AGENTIC_ADMIN_KEY como respaldo de sesión."; fi
          if [ -n "$GOOGLE_CLIENT_ID" ]; then printf '%s' "$GOOGLE_CLIENT_ID" | npx wrangler secret put GOOGLE_CLIENT_ID --name agenticweb; else echo "GOOGLE_CLIENT_ID no configurado: Google login quedará deshabilitado."; fi
          if [ -n "$MERCADOPAGO_ACCESS_TOKEN" ]; then printf '%s' "$MERCADOPAGO_ACCESS_TOKEN" | npx wrangler secret put MERCADOPAGO_ACCESS_TOKEN --name agenticweb; else echo "Mercado Pago no configurado."; fi
          if [ -n "$PAYPAL_CLIENT_ID" ]; then printf '%s' "$PAYPAL_CLIENT_ID" | npx wrangler secret put PAYPAL_CLIENT_ID --name agenticweb; else echo "PayPal Client ID no configurado."; fi
          if [ -n "$PAYPAL_CLIENT_SECRET" ]; then printf '%s' "$PAYPAL_CLIENT_SECRET" | npx wrangler secret put PAYPAL_CLIENT_SECRET --name agenticweb; else echo "PayPal Client Secret no configurado."; fi
      - name: Deploy Worker + Assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy worker.js --config wrangler.jsonc --name agenticweb
