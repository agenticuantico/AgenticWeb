name: Deploy AgenticWeb to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "worker.js"
      - "wrangler.jsonc"
      - "public/**"
      - ".github/workflows/cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing GitHub secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing GitHub secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          if [ -z "$HF_TOKEN" ]; then echo "HF_TOKEN no configurado: se usará el fallback de Cloudflare Workers AI"; fi

      - name: Generate AgentiCuantico brain GLB
        run: |
          python3 -m pip install --disable-pip-version-check --quiet numpy trimesh
          python3 scripts/generate_brain_glb.py public/assets/AgentiCuantico_brain_PBR.glb
          test -s public/assets/AgentiCuantico_brain_PBR.glb

      - name: Install Wrangler
        run: npm install --no-save wrangler@4.136.3

      - name: Configure Hugging Face secret in Worker (optional)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "$HF_TOKEN" ]; then
            printf '%s' "$HF_TOKEN" | npx wrangler secret put HF_TOKEN --name agenticweb
          else
            echo "HF_TOKEN no configurado; se mantendrá el fallback de Cloudflare Workers AI."
          fi
      - name: Configure GitHub/CodQ secrets (optional)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          AGENTIC_ADMIN_KEY: ${{ secrets.AGENTIC_ADMIN_KEY }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            printf '%s' "$GH_TOKEN" | npx wrangler secret put GH_TOKEN --name agenticweb
          else
            echo "GH_TOKEN no configurado: CodQ de escritura quedará deshabilitado."
          fi
          if [ -n "$AGENTIC_ADMIN_KEY" ]; then
            printf '%s' "$AGENTIC_ADMIN_KEY" | npx wrangler secret put AGENTIC_ADMIN_KEY --name agenticweb
          else
            echo "AGENTIC_ADMIN_KEY no configurado: la escritura administrativa de CodQ quedará deshabilitada."
          fi
      - name: Configure neural TTS secret (optional)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TTS_API_KEY: ${{ secrets.TTS_API_KEY }}
        run: |
          if [ -n "$TTS_API_KEY" ]; then
            printf '%s' "$TTS_API_KEY" | npx wrangler secret put TTS_API_KEY --name agenticweb
          else
            echo "TTS_API_KEY no configurado: la interfaz usará la voz del navegador como fallback."
          fi
      - name: Configure Auth + Billing secrets (optional)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH_SESSION_SECRET: ${{ secrets.AUTH_SESSION_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          MERCADOPAGO_ACCESS_TOKEN: ${{ secrets.MERCADOPAGO_ACCESS_TOKEN }}
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          PAYPAL_WEBHOOK_ID: ${{ secrets.PAYPAL_WEBHOOK_ID }}
        run: |
          if [ -n "$AUTH_SESSION_SECRET" ]; then printf '%s' "$AUTH_SESSION_SECRET" | npx wrangler secret put AUTH_SESSION_SECRET --name agenticweb; else echo "AUTH_SESSION_SECRET no configurado: se usará AGENTIC_ADMIN_KEY como respaldo de sesión."; fi
          if [ -n "$GOOGLE_CLIENT_ID" ]; then printf '%s' "$GOOGLE_CLIENT_ID" | npx wrangler secret put GOOGLE_CLIENT_ID --name agenticweb; else echo "GOOGLE_CLIENT_ID no configurado: Google login quedará deshabilitado."; fi
          if [ -n "$MERCADOPAGO_ACCESS_TOKEN" ]; then printf '%s' "$MERCADOPAGO_ACCESS_TOKEN" | npx wrangler secret put MERCADOPAGO_ACCESS_TOKEN --name agenticweb; else echo "Mercado Pago no configurado."; fi
          if [ -n "$PAYPAL_CLIENT_ID" ]; then printf '%s' "$PAYPAL_CLIENT_ID" | npx wrangler secret put PAYPAL_CLIENT_ID --name agenticweb; else echo "PayPal Client ID no configurado."; fi
          if [ -n "$PAYPAL_CLIENT_SECRET" ]; then printf '%s' "$PAYPAL_CLIENT_SECRET" | npx wrangler secret put PAYPAL_CLIENT_SECRET --name agenticweb; else echo "PayPal Client Secret no configurado."; fi
          if [ -n "$PAYPAL_WEBHOOK_ID" ]; then printf '%s' "$PAYPAL_WEBHOOK_ID" | npx wrangler secret put PAYPAL_WEBHOOK_ID --name agenticweb; else echo "PAYPAL_WEBHOOK_ID no configurado: PayPal webhook no activará planes hasta configurarlo."; fi
      - name: Validate Wrangler configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy worker.js --config wrangler.jsonc --name agenticweb --dry-run

      - name: Deploy Worker + Assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy worker.js --config wrangler.jsonc --name agenticweb

      - name: Smoke test deployed Worker
        run: |
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --connect-timeout 10 https://agenticweb.agenticuantico.workers.dev/health
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --connect-timeout 10 https://agenticweb.agenticuantico.workers.dev/v1/integrations/status | grep -q '"cloudflare":true'
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --connect-timeout 10 -X POST https://agenticweb.agenticuantico.workers.dev/v1/public/chat -H 'Content-Type: application/json' --data '{"message":"Respondé únicamente: AgentiCuantico OK","language":"es-AR","history":[],"attachments":[]}' | grep -q 'answer'
