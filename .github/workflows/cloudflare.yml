name: Deploy AgenticWeb to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "worker.js"
      - "_worker.js"
      - "wrangler.jsonc"
      - "index.html"
      - "app.js"
      - "styles.css"
      - ".github/workflows/cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Worker + Assets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy worker.js

      - name: Sync Hugging Face token to Worker
        if: ${{ secrets.HF_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          printf '%s' "$HF_TOKEN" | npx --yes wrangler@latest secret put HF_TOKEN --name agenticweb --account-id "$CLOUDFLARE_ACCOUNT_ID"
