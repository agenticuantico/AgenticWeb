<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AgentiCuantico — IA Agéntica</title>
<meta name="description" content="AgentiCuantico: cerebro de IA agéntica ejecutado localmente en el navegador.">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="shell">
<aside class="side">
  <div class="brand"><span class="orb"></span><b>AgentiCuantico</b></div>
  <button id="newChat">＋ Nueva conversación</button>
  <div class="side-note">Cerebro IA agéntico<br><small>Privacidad primero · ejecución local</small></div>
</aside>
<main class="main">
  <header>
    <div><strong>AgentiCuantico</strong><span id="status">Iniciando…</span></div>
    <div class="local-badge">LOCAL</div>
  </header>
  <section id="chat" class="chat">
    <div id="messages" class="messages"></div>
    <form id="composer">
      <textarea id="input" placeholder="Escribe un mensaje…" rows="1" autocomplete="off"></textarea>
      <button type="submit">Enviar</button>
    </form>
    <div class="memory">Las conversaciones se guardan solo en este navegador.</div>
  </section>
</main>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
